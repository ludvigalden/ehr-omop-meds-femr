# Pin of the CLMBR-T-Base dictionary.
#
# Every import checks the dictionary file's SHA-256 against `sha256` below and
# stops (exit 2) on any difference; both acquisition routes (the pinned
# Hugging Face revision and a local `--model-dir` copy of the same file) check
# the identical values. The derived concept set is checked against
# `concept_list_sha256` as a second, content-level pin.
#
# The model is gated: the hf route needs HF_TOKEN in the environment, set after
# accepting the model's access terms.

